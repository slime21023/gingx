name: actor-runtime-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'
          cache: maven
      - name: Verify reactor
        run: mvn --settings .mvn/settings.xml -B verify

  stress:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'
          cache: maven
      - name: Run concurrency stress suite
        run: mvn --settings .mvn/settings.xml -B -Pstress -pl actor-stress -am test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'
      - name: Build mdBook
        run: mdbook build docs
